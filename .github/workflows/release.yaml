name: Build & Release Extension

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: 🧪 Test
        run: npm test

      - name: 🛡️ Security Guardrails
        run: |
          # 1. Check for vulnerabilities in shipped code (Production deps only)
          # Fails if any high/critical issues are found
          echo "🔍 Scanning production dependencies..."
          npm audit --omit=dev --audit-level=high

          # 2. Prevent 'unsafe-eval' from sneaking into Manifest
          echo "🔍 Checking CSP in manifest..."
          if grep -q "unsafe-eval" public/manifest.json; then
            echo "::error file=public/manifest.json::❌ Security Fail: 'unsafe-eval' detected in manifest.json"
            exit 1
          fi

          # 3. Scan for Dangerous Dynamic Execution in Source
          echo "🔍 Scanning source for eval/new Function..."
          # We purposefully fail if these strings are found in src/
          if grep -rE "eval\(|new Function\(" src/; then
            echo "::error::❌ Security Fail: Unsafe dynamic execution detected in src/"
            exit 1
          fi

          echo "✅ All security checks passed."

      - name: Read manifest version
        id: ver
        run: |
          node -e "const m=require('./public/manifest.json'); console.log('version=' + m.version)" >> $GITHUB_OUTPUT

      - name: Check if version already released
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.ver.outputs.version }}$"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ v${{ steps.ver.outputs.version }} already released — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🆕 New version v${{ steps.ver.outputs.version }} — will release."
          fi

      # Entry text is the PR title, categorized by PR label and machine
      # translated, so no release copy is written by hand. Runs before the
      # build because the result is bundled into the extension.
      # Never blocks a release: a GitHub API or translation hiccup leaves the
      # previous changelog bundled, and `npm run changelog:build -- --seed`
      # backfills the missing version afterwards.
      - name: 📝 Build changelog
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run changelog:build -- --version=${{ steps.ver.outputs.version }}

      # Keeps the generated entries (and their translations) in the repo so the
      # next release does not pay to rebuild them. [skip ci] stops this push
      # from starting another release run.
      - name: Commit changelog
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          if git diff --quiet -- src/resources/changelog.json; then
            echo "⏭️ changelog.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resources/changelog.json
          git commit -m "chore: changelog for v${{ steps.ver.outputs.version }} [skip ci]"
          # Another merge may have landed on main while this run was building.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Build
        run: npm run build

      - name: Pack ZIP
        if: steps.check.outputs.skip == 'false'
        run: npm run pack

      - name: Create Release (or update)
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            sim-companies-extension-chrome.zip
