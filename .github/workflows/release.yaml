name: Build & Release Extension

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: ✅ Verify
        run: npm run verify

      - name: 🛡️ Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Read manifest version
        id: ver
        run: |
          node -e "const m=require('./public/manifest.json'); console.log('version=' + m.version)" >> $GITHUB_OUTPUT

      - name: Check if version already released
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.ver.outputs.version }}$"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ v${{ steps.ver.outputs.version }} already released — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🆕 New version v${{ steps.ver.outputs.version }} — will release."
          fi

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Pack ZIP
        if: steps.check.outputs.skip == 'false'
        run: npm run pack

      - name: Create Release (or update)
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            sim-companies-extension-chrome.zip
