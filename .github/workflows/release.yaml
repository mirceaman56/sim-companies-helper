name: Build & Release Extension

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: ✅ Verify
        run: npm run verify

      - name: 🛡️ Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Read manifest version
        id: ver
        run: |
          node -e "const m=require('./public/manifest.json'); console.log('version=' + m.version)" >> $GITHUB_OUTPUT

      - name: Check if version already released
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.ver.outputs.version }}$"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ v${{ steps.ver.outputs.version }} already released — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🆕 New version v${{ steps.ver.outputs.version }} — will release."
          fi

      - name: 📝 Build changelog
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run changelog:build -- --version=${{ steps.ver.outputs.version }}

      - name: 📝 Open changelog PR
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/resources/changelog.json; then
            echo "⏭️ changelog.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/changelog-v${{ steps.ver.outputs.version }}"
          git add src/resources/changelog.json
          git commit -m "chore: changelog for v${{ steps.ver.outputs.version }}"
          git push --force origin HEAD:"$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already open for $BRANCH"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: changelog for v${{ steps.ver.outputs.version }}" \
              --body "Auto-generated changelog entries for v${{ steps.ver.outputs.version }}. Not auto-merged — review and merge manually."
          fi

      # Rebuild so the bundle ships the changelog generated above.
      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Pack ZIP
        if: steps.check.outputs.skip == 'false'
        run: npm run pack

      - name: Create Release (or update)
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            sim-companies-extension-chrome.zip
