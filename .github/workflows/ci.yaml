name: CI

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # One command, same as agents run locally: lint, format, repo checks
      # (architecture, manifest, i18n, styles, instruction sync), tests, build.
      - name: ✅ Verify
        run: npm run verify

      - name: 🛡️ Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
